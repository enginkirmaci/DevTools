name: Build and Release Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Tag like v1.2.3 -> 1.2.3
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Manual dispatch has no tag; fall back so the build still works.
            VERSION="0.0.0-dev"
            echo "::warning::Build is not running from a tag; falling back to ${VERSION}"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Version '${VERSION}' (from '${GITHUB_REF_NAME}') is not in x.y.z format"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      # Single packaging entry point: restores, publishes both apps (build\win-x64\publish
      # and build\bin\win-x64\publish — the installer's sources), stages, verifies and
      # zips the portable payload. Everything lands under packaging\windows\.
      - name: Publish and zip portable
        shell: pwsh
        run: packaging\windows\build-portable.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      # The installer stages from the publish folders build-portable.ps1 left behind and
      # writes packaging\windows\installer\DevTools-Setup-<version>.exe.
      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} packaging\windows\setup.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevTools-Installer
          path: packaging/windows/installer/*.exe

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevTools-Portable
          path: packaging/windows/portable/*.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/windows/installer/*.exe
            packaging/windows/portable/*.zip
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
