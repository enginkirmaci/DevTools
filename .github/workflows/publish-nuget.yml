name: Publish NuGet

on:
  push:
    tags:
      - "markdownviewerkit-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/markdownviewerkit-v')
        run: |
          VERSION="${GITHUB_REF_NAME#markdownviewerkit-v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Version '${VERSION}' (from '${GITHUB_REF_NAME}') is not in x.y.z format"
            exit 1
          fi
          echo "MARKDOWNVIEWERKIT_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Resolved package version: ${VERSION}"

      - name: Pack
        run: packaging/nuget/build-nupkg.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: packaging/nuget/*

      - name: Push to nuget.org
        if: env.NUGET_API_KEY != ''
        run: |
          dotnet nuget push "packaging/nuget/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "packaging/nuget/*.snupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/nuget/*
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
