[package]
name = "devtools"
version.workspace = true
edition.workspace = true
description = "DevTools — repository workbench"

[lib]
name = "devtools"
path = "src/lib.rs"

[[bin]]
name = "devtools"
path = "src/main.rs"

[dev-dependencies]
# headless UI probes (tests/); feature-unifies with the normal gpui-kit dep
# only under `cargo test`
gpui-kit = { version = "0.7", features = ["test-support"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
devtools-core = { path = "../devtools-core" }

# gpui-pre: crates.io snapshots of zed's gpui, pinned to the exact rev
# gpui-kit 0.7 is built against (=zed@1a28cff). Bump together with gpui-kit.
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["wayland", "x11"] }
gpui-kit = { version = "0.7" }

# the shared component family (local sibling repos; swap to version deps to publish)
warpui-kit-core = { path = "../../../warpui-kit-core" }
warpui-kit-diff = { path = "../../../warpui-kit-diff", features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-yaml",
] }
warpui-kit-markdown = { path = "../../../warpui-kit-markdown" }
warpui-kit-picker = { path = "../../../warpui-kit-picker" }

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "time", "io-util", "sync"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
# the Add-Repositories Browse… button; portal backend shares gpui's ashpd
# stack on Linux (no GTK dependency), IFileDialog on Windows
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
